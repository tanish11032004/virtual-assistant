<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        #chat-area {
            width: 100%;
            height: 400px;
            overflow-y: scroll;
            background-color: #fff;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        #chat-area p {
            margin: 0;
            padding: 5px;
        }
        #input-area {
            display: flex;
        }
        #user-input {
            width: 80%;
            padding: 10px;
            font-size: 1em;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn {
            padding: 10px;
            border-radius: 4px;
            margin-left: 10px;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-danger {
            background-color: #dc3545;
            color: white;
        }
        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center">Chat with the Bot</h1>
        <div id="chat-area"></div>
        <div id="input-area">
            <input type="text" id="user-input" class="form-control" placeholder="Type your message...">
            <button id="send-btn" class="btn btn-primary">Send</button>
            <button id="voice-btn" class="btn btn-secondary">Voice Input</button>
            <button id="back-btn" class="btn btn-danger" onclick="window.location.href='../dashboard.html'">Back to Dashboard</button>
        </div>
    </div>

    <script>
        const chatArea = document.getElementById('chat-area');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const voiceBtn = document.getElementById('voice-btn');

        sendBtn.addEventListener('click', sendMessage);

        function sendMessage() {
            const userMessage = userInput.value;
            if (userMessage.trim() === '') return;

            // Display user's message
            chatArea.innerHTML += `<p><strong>You:</strong> ${userMessage}</p>`;
            userInput.value = '';

            // Send message to Flask backend
            fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: userMessage })
            })
            .then(response => response.json())
            .then(data => {
                const botResponse = data.response;
                chatArea.innerHTML += `<p><strong>Bot:</strong> ${botResponse}</p>`;
                chatArea.scrollTop = chatArea.scrollHeight;  // Auto-scroll to bottom
            })
            .catch(error => console.error('Error:', error));
        }

        voiceBtn.addEventListener('click', () => {
            // Voice recognition logic (can use Web Speech API or integrate Flask with speech recognition)
            alert("Voice input feature is under development.");
        });
    </script>
</body>
</html>
