{% extends "layout.html" %}

{% block title %}Login - Assistant AI{% endblock %}

{% block extra_css %}
<style>
    body {
        background: linear-gradient(135deg, #4a90e2, #9013fe);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: 'Arial', sans-serif;
        color: #fff;
    }

    .container {
        background: rgba(49, 49, 49, 0.7);
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        padding: 2rem;
        width: 100%;
        max-width: 400px;
        text-align: center;
        backdrop-filter: blur(15px);
    }

    h1 {
        font-size: 2.5rem;
        margin-bottom: 1.5rem;
        text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
    }

    .form-label {
        font-weight: bold;
        color: #fff;
        font-size: 0.9rem;
    }

    .btn-primary {
        background-color: #5c67f2;
        border: none;
        border-radius: 8px;
        padding: 10px;
        transition: all 0.3s;
    }

    .btn-primary:hover {
        background-color: #4a54e1;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .form-control {
        border-radius: 8px;
        background-color: rgba(255, 255, 255, 0.8);
        color: #444;
    }

    .form-control:focus {
        border-color: #5c67f2;
        box-shadow: 0 0 0 0.2rem rgba(92, 103, 242, 0.25);
    }

    .password-toggle {
        position: absolute;
        top: 50%;
        right: 0.75rem;
        transform: translateY(-50%);
        cursor: pointer;
        font-size: 1.25rem;
        color: #6c757d;
    }

    .text-muted-small {
        font-size: 0.75rem;
        color: #ddd;
    }

    @media (max-width: 576px) {
        .container {
            padding: 1rem;
            max-width: 100%;
        }
    }

    .alert {
        border-radius: 8px;
        margin-bottom: 1rem;
    }

    .form-floating {
        margin-bottom: 1rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <h1 class="mb-4">Login</h1>
    <form id="login-form" action="{{ url_for('login') }}" method="POST" class="needs-validation" novalidate>
        <div class="form-floating">
            <input type="text" class="form-control" id="username" name="username" 
                   placeholder="Username" required aria-label="Username">
            <label for="username">Username</label>
        </div>

        <div class="mb-3 form-group position-relative">
            <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
            <i class="bi bi-eye password-toggle" id="password-toggle"></i>
            <div class="invalid-feedback">Please provide a valid password.</div>
        </div>

        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe" name="rememberMe">
            <label class="form-check-label" for="rememberMe">Remember me</label>
        </div>

        <div class="mb-3">
            <a href="{{ url_for('forgot_password') }}" class="text-decoration-none text-primary">Forgot Password?</a>
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg" id="login-button">Login</button>
        </div>

        <div class="mt-4">
            <p class="text-muted-small">Don't have an account? <a href="{{ url_for('register') }}" class="text-primary">Sign up here</a></p>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Bootstrap form validation
    (function () {
        'use strict';
        const forms = document.querySelectorAll('.needs-validation');
        forms.forEach(form => {
            form.addEventListener('submit', function (event) {
                event.preventDefault();
                if (!form.checkValidity()) {
                    event.stopPropagation();
                } else {
                    const formData = new FormData(form);
                    fetch('/login', {
                        method: 'POST',
                        body: formData
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            window.location.href = '/dashboard';  // Adjust if necessary
                        } else {
                            alert(data.message);
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('An error occurred. Please try again.');
                    });
                }
                form.classList.add('was-validated');
            }, false);
        });
    })();

    // Password visibility toggle
    document.getElementById('password-toggle').addEventListener('click', function () {
        const passwordField = document.getElementById('password');
        const isPasswordVisible = passwordField.type === 'text';
        passwordField.type = isPasswordVisible ? 'password' : 'text';
        this.classList.toggle('bi-eye', isPasswordVisible);
        this.classList.toggle('bi-eye-slash', !isPasswordVisible);
    });

    // Enhance form validation and add loading states
    const form = document.getElementById('login-form');
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (form.checkValidity()) {
            showLoading();
            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: new FormData(form)
                });
                const data = await response.json();
                if (data.success) {
                    window.location.href = '{{ url_for("dashboard") }}';
                } else {
                    throw new Error(data.message);
                }
            } catch (error) {
                showError(error.message);
            } finally {
                hideLoading();
            }
        }
        form.classList.add('was-validated');
    });
</script>
{% endblock %}
</body>

</html>
