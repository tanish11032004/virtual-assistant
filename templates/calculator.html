<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Scientific Calculator</title>
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #FFFFFF;
            display: flex;
            justify-content: space-between;
            margin: 0;
            padding: 20px;
        }
        .calculator, .notepad {
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 5px;
        }
        .calculator {
            width: 45%;
        }
        .notepad {
            width: 45%;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            font-size: 1.5em;
            margin-bottom: 10px;
        }
        .button-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            padding: 15px;
            font-size: 1.2em;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45A049;
        }
        textarea {
            width: 100%;
            height: 400px;
            padding: 10px;
            font-size: 1.2em;
        }
        #history {
            height: 200px;
            overflow-y: auto;
            border: 1px solid #ccc;
            margin-top: 10px;
            padding: 5px;
        }
        .back-button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1.2em;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%; /* Full width */
        }
        .back-button:hover {
            background-color: #1E88E5;
        }
    </style>
</head>
<body>

    <!-- Calculator Section -->
    <div class="calculator">
        <h2>Enhanced Scientific Calculator</h2>
        <input type="text" id="expression" placeholder="Enter expression" />
        <div class="button-grid">
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('+')">+</button>
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('-')">-</button>
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('*')">*</button>
            <button onclick="clearEntry()">C</button>
            <button onclick="appendValue('0')">0</button>
            <button onclick="calculate()">=</button>
            <button onclick="appendValue('/')">/</button>
            <button onclick="appendValue('π')">π</button>
            <button onclick="appendValue('(')">(</button>
            <button onclick="appendValue(')')">)</button>
            <button onclick="appendValue('.')">.</button>
            <button onclick="memoryAdd()">M+</button>
            <button onclick="memorySubtract()">M-</button>
            <button onclick="memoryRecall()">MR</button>
            <button onclick="memoryClear()">MC</button>
            <button onclick="assignVariable()">Assign</button>
            <button onclick="unitConvert()">Convert</button>
            <button onclick="logicalOperation()">Logical</button>
        </div>
        <div id="history"></div>
        <button class="back-button" onclick="goToDashboard()">Back to Dashboard</button> <!-- Back to Dashboard Button -->
    </div>

    <!-- Notepad Section -->
    <div class="notepad">
        <h2>Notepad</h2>
        <textarea id="notepad" placeholder="Your notes will appear here..."></textarea>
    </div>

    <script>
        let memory = 0;
        const variables = {};

        function appendValue(value) {
            const expression = document.getElementById("expression");
            expression.value += value;
        }

        function clearEntry() {
            document.getElementById("expression").value = "";
        }

        function calculate() {
            let expression = document.getElementById("expression").value;
            try {
                if (expression.includes('π')) {
                    expression = expression.replace(/π/g, Math.PI);
                }
                const result = eval(expression); // Use eval() carefully, ideally sanitize input
                document.getElementById("expression").value = result;
                appendToNotepad(`${expression} = ${result}`);
                appendToHistory(`${expression} = ${result}`);
            } catch (error) {
                alert("Error in calculation!");
            }
        }

        function appendToNotepad(text) {
            const notepad = document.getElementById("notepad");
            notepad.value += text + "\n";
        }

        function appendToHistory(text) {
            const history = document.getElementById("history");
            history.innerHTML += `<div>${text}</div>`;
        }

        function memoryAdd() {
            const value = parseFloat(document.getElementById("expression").value);
            memory += isNaN(value) ? 0 : value;
            alert(`Memory updated to: ${memory}`);
        }

        function memorySubtract() {
            const value = parseFloat(document.getElementById("expression").value);
            memory -= isNaN(value) ? 0 : value;
            alert(`Memory updated to: ${memory}`);
        }

        function memoryRecall() {
            document.getElementById("expression").value = memory;
        }

        function memoryClear() {
            memory = 0;
            alert("Memory cleared.");
        }

        function assignVariable() {
            const assignment = prompt("Enter variable assignment (e.g., x=5):");
            if (assignment) {
                const [varName, value] = assignment.split('=');
                variables[varName.trim()] = parseFloat(value.trim());
                alert(`Variable '${varName.trim()}' assigned to ${value.trim()}.`);
            }
        }

        function unitConvert() {
            const conversion = prompt("Enter conversion (e.g., '10 Meters to Feet'): ");
            if (conversion) {
                const [amount, fromUnit, , toUnit] = conversion.split(' ');
                const amountValue = parseFloat(amount);
                let result;

                const conversionFactors = {
                    'Meters to Feet': 3.28084,
                    'Feet to Meters': 0.3048,
                    'Kilometers to Miles': 0.621371,
                    'Miles to Kilometers': 1.60934,
                    'Celsius to Fahrenheit': (c) => (c * 9 / 5) + 32,
                    'Fahrenheit to Celsius': (f) => (f - 32) * 5 / 9,
                    'Pounds to Kilograms': 0.453592,
                    'Kilograms to Pounds': 2.20462,
                };

                const key = `${fromUnit} to ${toUnit}`;
                if (key in conversionFactors) {
                    if (typeof conversionFactors[key] === 'function') {
                        result = conversionFactors[key](amountValue);
                    } else {
                        result = amountValue * conversionFactors[key];
                    }
                    alert(`${amountValue} ${fromUnit} = ${result.toFixed(4)} ${toUnit}`);
                } else {
                    alert("Invalid conversion type.");
                }
            }
        }

        function logicalOperation() {
            const operation = prompt("Enter logical operation (e.g., '1 AND 0', 'NOT 1'): ");
            if (operation) {
                try {
                    let result;
                    if (operation.includes('AND')) {
                        const [a, , b] = operation.split(' ');
                        result = (parseInt(a) && parseInt(b)) ? 1 : 0;
                    } else if (operation.includes('OR')) {
                        const [a, , b] = operation.split(' ');
                        result = (parseInt(a) || parseInt(b)) ? 1 : 0;
                    } else if (operation.includes('XOR')) {
                        const [a, , b] = operation.split(' ');
                        result = (parseInt(a) ^ parseInt(b));
                    } else if (operation.includes('NOT')) {
                        const [_, a] = operation.split(' ');
                        result = !parseInt(a) ? 1 : 0;
                    }
                    alert(`Result: ${result}`);
                } catch (error) {
                    alert("Error in logical operation!");
                }
            }
        }

        function goToDashboard() {
            // Redirect to the dashboard page
            window.location.href = "dashboard.html"; // Update with the correct dashboard URL
        }
    </script>

</body>
</html>
