<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4a90e2">
    <title>{% block title %}Assistant AI{% endblock %}</title>
    
    <!-- Shared resources -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- PWA support -->
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/favicon-32x32.png') }}">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Error boundary -->
    <div id="error-container" class="alert alert-danger d-none"></div>
    
    <!-- Loading indicator -->
    <div id="loading-overlay" class="loading-overlay d-none">
        <div class="spinner-border text-primary"></div>
    </div>
    
    <!-- Theme toggle -->
    <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme">
        <i class="bi bi-moon-stars"></i>
    </button>
    
    <nav class="nav flex-column">
        <a class="nav-link" href="{{ url_for('dashboard') }}"><i class="bi bi-house-door"></i> Dashboard</a>
        <a class="nav-link" href="{{ url_for('activity_log') }}"><i class="bi bi-clipboard"></i> Activity Log</a>
        <a class="nav-link" href="{{ url_for('settings') }}"><i class="bi bi-gear"></i> Settings</a>
        <a class="nav-link" href="{{ url_for('user_guide') }}"><i class="bi bi-question-circle"></i> User Guide</a>
        <a class="nav-link" href="{{ url_for('logout') }}"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </nav>
    
    {% block content %}{% endblock %}
    
    <!-- Shared scripts -->
    <script src="{{ url_for('static', filename='js/shared.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    {% block extra_js %}{% endblock %}
    
    <script>
        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js')
                .then(registration => console.log('ServiceWorker registered'))
                .catch(err => console.error('ServiceWorker registration failed:', err));
        }
        
        // Initialize theme toggle
        document.getElementById('theme-toggle').addEventListener('click', () => {
            themeManager.toggle();
        });
    </script>
</body>
</html>
