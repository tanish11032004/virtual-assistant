<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <style>
        :root {
    /* Light Mode Variables */
    --primary-bg: #f0f2f5;
    --primary-text: #333;
    --card-bg: #fff;
    --card-text: #333;
    --navbar-bg: #fff;
    --navbar-text: #333;
    --sidebar-bg: #343a40;
    --sidebar-text: #adb5bd;
    --sidebar-hover-bg: #495057;
    --sidebar-active-bg: #495057;
    --btn-bg: #495057;
    --btn-hover-bg: #6c757d;
    --footer-bg: #ffffff;
    --footer-border: #dee2e6;
}

body.dark-mode {
    /* Dark Mode Variables */
    --primary-bg: #1e1e1e;
    --primary-text: #e0e0e0;
    --card-bg: #2c2c2c;
    --card-text: #e0e0e0;
    --navbar-bg: #3a3a3a;
    --navbar-text: #e0e0e0;
    --sidebar-bg: #2e2e2e;
    --sidebar-text: #adb5bd;
    --sidebar-hover-bg: #495057;
    --sidebar-active-bg: #495057;
    --btn-bg: #495057;
    --btn-hover-bg: #6c757d;
    --footer-bg: #3a3a3a;
    --footer-border: #444;
}

body {
    display: flex;
    min-height: 100vh;
    flex-direction: column;
    background-color: var(--primary-bg);
    color: var(--primary-text);
    margin: 0;
    overflow-x: hidden;
}

/* Sidebar */
.sidebar {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    z-index: 100;
    height: 100%;
    background-color: var(--sidebar-bg);
    color: var(--sidebar-text);
    transition: width 0.3s;
    width: 250px;
    box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
}

.sidebar.minimized {
    width: 80px;
}

.sidebar .nav-link {
    color: var(--sidebar-text);
    font-size: 1rem;
    padding: 0.75rem 1.5rem;
    transition: background-color 0.3s, color 0.3s;
}

.sidebar .nav-link.active,
.sidebar .nav-link:hover {
    color: #fff;
    background-color: var(--sidebar-hover-bg);
}

.sidebar .nav-link i {
    margin-right: 1rem;
}

.sidebar.minimized .nav-link i {
    display: none;
}

.sidebar.minimized .nav-link {
    text-align: center;
}

/* Sidebar toggle button */
.sidebar-toggle {
    position: absolute;
    top: 1rem;
    right: -2.5rem;
    z-index: 101;
    background-color: var(--btn-bg);
    color: #fff;
    border: none;
    border-radius: 0.5rem;
    padding: 0.5rem;
    cursor: pointer;
    transition: background-color 0.3s;
}

.sidebar-toggle:hover {
    background-color: var(--btn-hover-bg);
}

/* Top Bar */
.topbar {
    background-color: var(--navbar-bg);
    padding: 1rem;
    border-bottom: 1px solid var(--footer-border);
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.topbar .navbar-brand {
    font-size: 1.5rem;
    font-weight: bold;
    color: var(--navbar-text);
}

/* Main Content */
.main-content {
    margin-left: 250px;
    padding: 2rem;
    flex: 1;
    transition: margin-left 0.3s;
    background-color: var(--primary-bg);
    color: var(--primary-text);
}

.main-content.sidebar-minimized {
    margin-left: 80px;
}

/* Cards */
.card {
    background-color: var(--card-bg);
    color: var(--card-text);
    border-radius: 0.5rem;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    overflow: hidden;
}

.card-header {
    background-color: #f8f9fa;
    color: var(--card-text);
}

.card-body {
    padding: 1.5rem;
}

/* Footer */
.footer {
    background-color: var(--footer-bg);
    padding: 1rem;
    text-align: center;
    border-top: 1px solid var(--footer-border);
}

    </style>
</head>

<body>
    <div class="container">
        <h1 class="mb-4 text-center">Forgot Password</h1>
        <p class="text-muted mb-4 text-center">Enter your email to reset your password</p>

        <form id="forgot-password-form" action="/reset-password" method="POST" class="needs-validation" novalidate>
            <!-- Email Section -->
            <div id="email-section">
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                    <div class="invalid-feedback">Please provide a valid email address.</div>
                </div>

                <div class="d-grid">
                    <button type="button" class="btn btn-primary btn-lg" id="send-reset-link">Send Reset Link</button>
                </div>
            </div>

            <!-- Set New Password Section (Initially hidden) -->
            <div id="password-section" class="hidden">
                <div class="mb-3">
                    <label for="new-password" class="form-label">New Password <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" id="new-password" name="new-password" placeholder="Enter new password" required>
                    <i class="bi bi-eye password-toggle" id="password-toggle"></i>
                    <div class="invalid-feedback">Please enter a valid password.</div>
                </div>

                <div class="mb-3">
                    <label for="confirm-password" class="form-label">Confirm Password <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" id="confirm-password" name="confirm-password" placeholder="Confirm new password" required>
                    <div class="invalid-feedback">Passwords do not match.</div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">Set New Password</button>
                </div>
            </div>

            <div class="mt-4 text-center">
                <a href="login.html" class="text-decoration-none text-primary">Back to Login</a>
            </div>
        </form>
    </div>

    <script>
        // Bootstrap form validation
        (function () {
            'use strict';
            var forms = document.querySelectorAll('.needs-validation');
            Array.prototype.slice.call(forms).forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    event.preventDefault();
                    if (!form.checkValidity()) {
                        event.stopPropagation();
                    } else {
                        const formData = new FormData(form);
                        fetch('/reset-password', {
                            method: 'POST',
                            body: formData
                        })
                        .then(response => response.json())
                        .then(data => {
                            if (data.success) {
                                alert('Password reset successfully. Please login with your new password.');
                                window.location.href = '/login';
                            } else {
                                alert(data.message);
                            }
                        })
                        .catch(error => {
                            console.error('Error:', error);
                            alert('An error occurred. Please try again.');
                        });
                    }
                    form.classList.add('was-validated');
                }, false);
            });
        })();

        // Password visibility toggle
        document.getElementById('password-toggle').addEventListener('click', function () {
            var passwordField = document.getElementById('new-password');
            var isPassword = passwordField.type === 'password';
            passwordField.type = isPassword ? 'text' : 'password';
            this.classList.toggle('bi-eye-slash', isPassword);
            this.classList.toggle('bi-eye', !isPassword);
        });

        // Handle form toggle between email and password sections
        document.getElementById('send-reset-link').addEventListener('click', function () {
            var email = document.getElementById('email');
            if (email.checkValidity()) {
                fetch('/send-reset-link', {
                    method: 'POST',
                    body: JSON.stringify({ email: email.value }),
                    headers: { 'Content-Type': 'application/json' }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('email-section').classList.add('hidden');
                        document.getElementById('password-section').classList.remove('hidden');
                    } else {
                        alert(data.message);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('An error occurred. Please try again.');
                });
            } else {
                email.classList.add('was-validated');
            }
        });

        // Validate that the new password and confirm password match
        document.getElementById('forgot-password-form').addEventListener('submit', function (event) {
            var newPassword = document.getElementById('new-password');
            var confirmPassword = document.getElementById('confirm-password');
            if (newPassword.value !== confirmPassword.value) {
                event.preventDefault();
                confirmPassword.setCustomValidity("Passwords don't match");
            } else {
                confirmPassword.setCustomValidity('');
            }
        });
    </script>
</body>

</html>
