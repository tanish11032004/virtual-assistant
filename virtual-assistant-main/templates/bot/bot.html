<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robotic Hand Chatbot</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      height: 100vh;
      background-color: #f4f4f4;
      color: #333;
      overflow: hidden;
    }

    .hand-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-style: preserve-3d;
      transition: transform 0.5s ease-in-out;
    }

    .wrist {
      width: 50px;
      height: 30px;
      background-color: #888;
      background-image: url('metal-texture.jpg');
      background-size: cover;
      border-radius: 10px;
      margin-bottom: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transform: rotateX(10deg) rotateY(15deg);
    }

    .palm {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      width: 200px;
      height: 100px;
      background-color: #666;
      background-image: url('metal-texture.jpg');
      background-size: cover;
      border-radius: 20px 20px 0 0;
      position: relative;
      transform: rotateX(0deg);
    }

    .finger {
      width: 20px;
      height: 40px;
      background-color: #444;
      background-image: url('metal-texture.jpg');
      background-size: cover;
      margin: 0 5px;
      border-radius: 10px;
      position: absolute;
      bottom: 0;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease;
    }

    .thumb {
      left: -30px;
      transform-origin: top right;
    }

    .index {
      left: 40px;
    }

    .middle {
      left: 80px;
    }

    .ring {
      left: 120px;
    }

    .pinky {
      left: 160px;
    }

    #chat-box {
      max-height: 400px;
      overflow-y: scroll;
      width: 90%;
      margin: 20px 0;
      padding: 10px;
      border-radius: 10px;
      background-color: #fff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .message {
      margin: 10px 0;
      padding: 10px;
      border-radius: 10px;
    }

    .user-message {
      background-color: #d1e7dd;
      text-align: right;
    }

    .bot-message {
      background-color: #f8d7da;
      text-align: left;
    }

    .chat-button {
      padding: 10px;
      background-color: #008cba;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px;
      transition: background-color 0.3s;
    }

    .chat-button:hover {
      background-color: #006f8e;
    }

    /* Responsive Design */
    @media (max-width: 600px) {
      .hand-container {
        width: 90%;
      }

      #chat-box {
        width: 100%;
      }

      .chat-button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="hand-container">
    <div class="wrist"></div>
    <div class="palm">
      <div class="finger thumb"></div>
      <div class="finger index"></div>
      <div class="finger middle"></div>
      <div class="finger ring"></div>
      <div class="finger pinky"></div>
    </div>
    <div id="chat-box"></div>

    <button class="chat-button" onclick="startVoiceRecognition()">Start Voice Input</button>
    <button class="chat-button" onclick="saveName()">Save Name</button>
    <button class="chat-button" onclick="clearChat()">Clear Chat</button>
  </div>

  <script>
    let username = localStorage.getItem('username') || 'Guest';
    let chatBox = document.getElementById('chat-box');

    // Greet the user when the page loads
    displayMessage('bot', `Hello, ${username}! How can I assist you today?`);

    // Display messages in the chat box
    function displayMessage(sender, message) {
      let messageDiv = document.createElement('div');
      messageDiv.classList.add('message', `${sender}-message`);
      messageDiv.textContent = message;
      chatBox.appendChild(messageDiv);
      chatBox.scrollTop = chatBox.scrollHeight; // Scroll to bottom
    }

    // Respond to user input
    function generateBotResponse(userMessage) {
      let botResponse = '';
      if (userMessage.toLowerCase().includes('hello')) {
        botResponse = 'Hello! How can I help you today?';
      } else if (userMessage.toLowerCase().includes('bye')) {
        botResponse = 'Goodbye! Have a great day!';
      } else {
        botResponse = 'I didn’t understand that. Can you try again?';
      }
      displayMessage('bot', botResponse);
    }

    // Save the user’s name
    function saveName() {
      const name = prompt("What's your name?");
      if (name) {
        username = name;
        localStorage.setItem('username', name);
        displayMessage('bot', `Nice to meet you, ${name}!`);
      }
    }

    // Clear the chat box
    function clearChat() {
      chatBox.innerHTML = '';
    }

    // Start voice recognition
    function startVoiceRecognition() {
      const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.lang = 'en-US';

      recognition.onresult = function(event) {
        const userMessage = event.results[0][0].transcript;
        displayMessage('user', userMessage);
        generateBotResponse(userMessage);
      };

      recognition.start();
    }

    // For dynamic buttons based on chat responses
    function sendPredefinedMessage(message) {
      displayMessage('user', message);
      generateBotResponse(message);
    }

    // Generate responses and interact with the buttons
    const predefinedMessages = ['Hello', 'Bye', 'Tell me a joke'];
    predefinedMessages.forEach(msg => {
      const button = document.createElement('button');
      button.classList.add('chat-button');
      button.textContent = msg;
      button.onclick = () => sendPredefinedMessage(msg);
      document.body.appendChild(button);
    });

  </script>
</body>
</html>
